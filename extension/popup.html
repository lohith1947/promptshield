<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>promptshield</title>
<style>
  :root {
    --bg: #0e141c;
    --panel: #161d28;
    --panel2: #1c2532;
    --border: #273244;
    --text: #eef3f9;
    --muted: #8aa0b8;
    --blue: #4f9cf9;
    --green: #7cb342;
    --red: #e74c3c;
    --orange: #f5a623;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 340px; background: var(--bg); color: var(--text); font: 13px/1.5 system-ui; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 14px; letter-spacing: .2px; }
  .brand span { color: var(--blue); }
  #status { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px rgba(231,76,60,.15); }
  .dot.ok { background: var(--green); box-shadow: 0 0 0 3px rgba(124,179,66,.15); }
  main { padding: 14px 16px; display: grid; gap: 12px; }
  label { color: var(--muted); font: 600 11px/1 system-ui; letter-spacing: .6px; text-transform: uppercase; }
  textarea { width: 100%; height: 78px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font: 12.5px/1.5 ui-monospace, Consolas, monospace; resize: vertical; outline: none; }
  textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(79,156,249,.15); }
  #scan { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--blue); color: #fff; font: 600 13px/1 system-ui; cursor: pointer; }
  #scan:hover { filter: brightness(1.1); }
  #verdict { display: none; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12px; }
  #verdict.block { display: flex; flex-direction: column; gap: 8px; border-color: rgba(231,76,60,.5); background: rgba(231,76,60,.1); }
  #verdict.redact { display: flex; flex-direction: column; gap: 8px; border-color: rgba(245,166,35,.5); background: rgba(245,166,35,.1); }
  #verdict.log, #verdict.pass { display: block; border-color: rgba(124,179,66,.5); background: rgba(124,179,66,.1); }
  #verdict .title { font-weight: 700; }
  #verdict.block .title { color: #ff8a80; }
  #verdict.redact .title { color: #ffc46b; }
  #verdict.log .title, #verdict.pass .title { color: #a5d6a7; }
  #verdict .names { display: flex; flex-wrap: wrap; gap: 4px; }
  #verdict .names span { font: 600 10.5px/1.3 ui-monospace, Consolas, monospace; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; opacity: .85; }
  #verdict .names .crit { color: #ff8a80; }
  #verdict .names .med { color: #ffc46b; }
  footer { padding: 10px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 10.5px; background: var(--panel); }
</style>
</head>
<body>
<header>
  <div class="brand">prompt<span>shield</span></div>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">checking...</span></div>
</header>
<main>
  <label>Test a prompt before sending</label>
  <textarea id="text" placeholder="e.g. My API key is sk-..."></textarea>
  <button id="scan">Scan prompt</button>
  <div id="verdict"></div>
</main>
<footer>
  Live protection is automatic on chatgpt.com, claude.ai, gemini &amp; more, via your local gateway at 127.0.0.1:8080.
</footer>
<script src="popup.js"></script>
</body>
</html>
