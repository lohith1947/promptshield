<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>promptshield</title>
<style>
  /* Google Material Design — light theme */
  :root {
    --md-bg: #ffffff;
    --md-surface: #ffffff;
    --md-surface-variant: #f8f9fa;
    --md-on-surface: #202124;
    --md-on-surface-variant: #5f6368;
    --md-outline: #dadce0;
    --md-outline-variant: #e8eaed;
    --md-primary: #1a73e8;
    --md-primary-hover: #1765cc;
    --md-on-primary: #ffffff;
    --md-green: #188038;
    --md-red: #d93025;
    --md-amber: #f9ab00;
    --md-sys-shape-corner-extra-small: 4px;
    --md-sys-shape-corner-small: 8px;
    --md-elevation-1: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
    --md-elevation-3: 0 1px 2px 0 rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 350px;
    background: var(--md-bg);
    color: var(--md-on-surface);
    font: 14px/1.5 Roboto, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Top app bar (Material top-app-bar) */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    padding: 0 16px;
    background: var(--md-surface);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; letter-spacing: .2px; color: var(--md-on-surface); }
  .brand svg { flex: none; }
  #status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--md-on-surface-variant); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--md-outline); }
  .dot.ok { background: var(--md-green); }
  .dot.bad { background: var(--md-red); }
  main { padding: 12px 16px 16px; display: grid; gap: 14px; }
  label {
    color: var(--md-on-surface-variant);
    font: 500 11px/1 system-ui, Roboto, sans-serif;
    letter-spacing: .8px;
    text-transform: uppercase;
  }
  textarea {
    width: 100%;
    min-height: 84px;
    background: var(--md-surface);
    color: var(--md-on-surface);
    border: 1px solid var(--md-outline);
    border-radius: var(--md-sys-shape-corner-extra-small);
    padding: 10px 12px;
    font: 13px/1.5 Roboto, "Segoe UI", system-ui, sans-serif;
    resize: vertical;
    outline: none;
    transition: border-color 120ms;
  }
  textarea:hover { border-color: var(--md-on-surface); }
  textarea:focus { border: 2px solid var(--md-primary); padding: 9px 11px; }
  textarea::placeholder { color: #80868b; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    padding: 0 22px;
    border: none;
    border-radius: var(--md-sys-shape-corner-extra-small);
    background: var(--md-primary);
    color: var(--md-on-primary);
    font: 500 14px/1 Roboto, "Segoe UI", system-ui, sans-serif;
    letter-spacing: .1px;
    cursor: pointer;
    box-shadow: var(--md-elevation-1);
    transition: background 120ms;
  }
  .btn:hover { background: var(--md-primary-hover); }
  .btn:active { box-shadow: var(--md-elevation-3); }
  .btn:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
  .btn.wide { width: 100%; }
  /* Result card */
  #verdict { display: none; border: 1px solid var(--md-outline); border-radius: var(--md-sys-shape-corner-small); padding: 12px 14px; font-size: 12.5px; }
  #verdict.block { display: block; border-color: #f2a19c; background: #fce8e6; color: #c5221f; }
  #verdict.redact { display: block; border-color: #f9d9a6; background: #fef7e0; color: #b06000; }
  #verdict.log, #verdict.pass { display: block; border-color: #ceead6; background: #e6f4ea; color: #137333; }
  #verdict .title { font-weight: 500; }
  #verdict .names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #verdict .names span {
    font: 500 11px/1.3 Roboto, "Segoe UI", system-ui, sans-serif;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid currentColor;
    opacity: .88;
  }
  /* Masked version card */
  #masked { display: none; gap: 6px; flex-direction: column; }
  #masked.show { display: flex; }
  #masked .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #masked .row span { color: var(--md-on-surface-variant); font: 500 11px/1 system-ui, Roboto, sans-serif; letter-spacing: .8px; text-transform: uppercase; }
  #masked textarea { color: var(--md-on-surface); }
  #copyMasked {
    height: 30px;
    padding: 0 14px;
    border-radius: var(--md-sys-shape-corner-extra-small);
    border: 1px solid var(--md-outline);
    background: var(--md-surface);
    color: var(--md-primary);
    font: 500 12.5px/1 Roboto, "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
  }
  #copyMasked:hover { background: var(--md-surface-variant); }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-top: 1px solid var(--md-outline-variant);
    color: var(--md-on-surface-variant);
    font-size: 11px;
    background: var(--md-surface);
  }
  footer a { color: var(--md-primary); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2l8 3.2V11c0 4.7-3.3 8.3-8 11-4.7-2.7-8-6.3-8-11V5.2L12 2z" stroke="#1a73e8" stroke-width="1.6" fill="#e8f0fe"/>
      <path d="M9 11.6l2.1 2.1 4.1-4.3" stroke="#1a73e8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    promptshield
  </div>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">Checking gateway…</span></div>
</header>
<main>
  <label for="text">Test a prompt before sending</label>
  <textarea id="text" placeholder="e.g. My API key is sk-..."></textarea>
  <button class="btn wide" id="scan">Scan prompt</button>
  <div id="verdict"></div>
  <div id="masked">
    <div class="row"><span>Masked version (safe to send)</span><button id="copyMasked">Copy</button></div>
    <textarea id="maskedText" readonly></textarea>
  </div>
</main>
<footer>
  <span>Protected on 15 AI chat sites</span>
  <a href="#" id="privacyLink">Privacy</a>
</footer>
<script src="popup.js"></script>
</body>
</html>
